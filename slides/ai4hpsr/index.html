# ...In the Same Vein

- **USA**: paused a **US $10 billion** Oracle-Cerner contract [after safety concerns](https://www.fiercehealthcare.com/ai-and-machine-learning/lawmakers-grill-va-oracle-leaders-over-pharmacy-related-patient-safety) 
- [**Denmark**](https://www.politico.com/story/2019/06/06/epic-denmark-health-1510223) and **Finland**: spent a combined **US $100  million** on Epic, yet [implementations were still troubled years after the first go-live](https://www.sciencedirect.com/science/article/abs/pii/S1386505622001824?via%3Dihub)
- **Australia's** personal health record has [absorbed over **US $1.3 billion**](https://www.anao.gov.au/sites/default/files/2024-06/Auditor-General_Report_2023-24_36.pdf), most to one vendor

--

# What if...

...countries spent less on proprietary software and more on health policy and systems research, open ecosystems, skills, and institutional support?

# 💡

## Capacity Building

### Framing the Discussion

--

## Going Beyond Generative AI

- AI in HPSR is more than GenAI.
  - Predictive analytics
  - Causal inference
  - Simulation & optimisation
  - Image analysis
- **Need:** Broaden framing to reflect the full spectrum of AI tools relevant to HPSR.

--

## Broaden Engagement with Non-Technical Actors?

- Discuss how AI could:
  - Support decision-makers
  - Empower civil society
  - Strengthen community participation
- **Need:** Illustrate practical pathways for inclusive use beyond researchers.

--

## How to Build the Evidence Base?

- Current documentation is largely anecdotal.
- Lack of systematic tracking of AI use in HPSR.
- **Need:**
  - Roadmap for building a cumulative evidence base
  - Registries of AI applications in HPSR
  - Shared reporting standards for transparency

--

## Going Beyond AI Literacy

- Current emphasis: AI literacy and mentoring.
- Attend to infrastructure foundations:
  - **Regional compute hubs**
  - **Open datasets**
  - **Shared repositories and tools**
- **Need:** Prioritise investments that enable equitable access and sustainability.

--

## Roles for Global Institutions?

- **Need:** Clearer hints on priorities:
  - Should WHO, funders, or regional bodies convene **standards**?
  - Should they **invest in open-source models/tools**?
  - Should they negotiate with commercial vendors on **fair terms**?
  - Should they support **shared infrastructure**?
  - What should be their **position on intellectual property** and data governance?
